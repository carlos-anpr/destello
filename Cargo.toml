[package]
name = "destello"
version = "1.0.0"
edition = "2021"
description = "Capturador de pantalla moderno para Windows"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
chrono = "0.4"

[features]
default = ["ui"]
# La capa de UI (src/ui/*) la escribe otro agente. Se activa cuando está lista;
# sin ella el resto (CLI, captura, portapapeles, bandeja) compila y se prueba igual.
ui = []

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging",
  "Win32_Graphics_Imaging_D2D", "Win32_Graphics_Dxgi_Common",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory",
  "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_Accessibility",
  "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_Security",
]

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
